<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Game Settings - GateDash Lite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700;800&amp;family=Inter:wght@400;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "surface-container-high": "#2a292f",
                        "secondary-container": "#b600f8",
                        "surface-container": "#1f1f25",
                        "tertiary-container": "#ffd49c",
                        "on-tertiary-fixed-variant": "#624000",
                        "surface-container-lowest": "#0e0e13",
                        "surface-dim": "#131318",
                        "tertiary": "#fff6ef",
                        "on-surface-variant": "#b9cacb",
                        "inverse-surface": "#e4e1e9",
                        "on-background": "#e4e1e9",
                        "secondary": "#ebb2ff",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-container": "#845600",
                        "on-surface": "#e4e1e9",
                        "surface-variant": "#35343a",
                        "on-secondary-container": "#fff6fc",
                        "secondary-fixed-dim": "#ebb2ff",
                        "on-tertiary": "#452b00",
                        "error": "#ffb4ab",
                        "surface-tint": "#00dbe7",
                        "outline-variant": "#3a494b",
                        "on-primary-fixed": "#002022",
                        "tertiary-fixed": "#ffddb3",
                        "on-secondary": "#520072",
                        "on-primary-container": "#006a71",
                        "primary-container": "#00f2ff",
                        "surface-container-low": "#1b1b20",
                        "primary-fixed": "#74f5ff",
                        "secondary-fixed": "#f8d8ff",
                        "background": "#131318",
                        "on-tertiary-fixed": "#291800",
                        "inverse-on-surface": "#303036",
                        "on-secondary-fixed-variant": "#74009f",
                        "primary-fixed-dim": "#00dbe7",
                        "primary": "#e1fdff",
                        "on-secondary-fixed": "#320047",
                        "inverse-primary": "#00696f",
                        "surface-bright": "#39383e",
                        "on-primary": "#00363a",
                        "surface-container-highest": "#35343a",
                        "surface": "#131318",
                        "tertiary-fixed-dim": "#ffb950",
                        "error-container": "#93000a",
                        "outline": "#849495",
                        "on-primary-fixed-variant": "#004f54"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "unit": "4px",
                        "margin-desktop": "32px",
                        "hud-gap": "8px"
                    },
                    "fontFamily": {
                        "display-lg": ["Geist", "sans-serif"],
                        "label-caps": ["Inter", "sans-serif"],
                        "body-rt": ["Inter", "sans-serif"],
                        "display-lg-mobile": ["Geist", "sans-serif"],
                        "data-lg": ["JetBrains Mono", "monospace"],
                        "data-sm": ["JetBrains Mono", "monospace"],
                        "headline-md": ["Geist", "sans-serif"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-caps": ["11px", { "lineHeight": "12px", "letterSpacing": "0.15em", "fontWeight": "700" }],
                        "body-rt": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "data-lg": ["20px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "data-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .scanline-overlay {
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.4) 51%);
            background-size: 100% 4px;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-rt overflow-hidden antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Blurred Gameplay Background (Z-0) -->
<div class="fixed inset-0 z-0 bg-cover bg-center brightness-[0.35] blur-md scale-[1.02]" data-alt="A high-octane, neon-infused retro arcade space shooter gameplay scene. Vivid cyan and magenta laser blasts crisscross a deep, starry void. Glowing polygonal enemy ships and a sleek player fighter are frozen in action, emitting intense particle effects. The overall mood is electric, urgent, and technically advanced, with a strong high-contrast, glowing glassmorphism aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDi-xeIr0qB86W7qV5ZY59-eVlJTWKZLTUThyR7g_5Rze9gnrv3xTOMEHp9KTwQlraTPAZESVCZ7tlxtCEbYUILG4OGKTkIDvdyRTQEdsOhPDzPGjwUY7Ug2Gmi2tb7PaJMCCTNsMr4IFvksu2yeJ9kXyYliyP5XUvIMd2mR9JcwYkVPNY40Tgs4xc5ihtrDft8ak5nt6y2QkyU86TQJBTE1CE4lJEHFKq94w1O2pmcQTDFEAggoqXpxDdUC5PpFT0LWlfZtKyvTJA');">
</div>
<!-- Modal Overlay Container (Z-30) -->
<div class="fixed inset-0 z-30 flex items-center justify-center p-gutter md:p-margin-desktop bg-surface-container-lowest/60 backdrop-blur-xl">
<!-- Settings Modal Card -->
<div class="w-full max-w-[520px] bg-surface-container/70 backdrop-blur-2xl border border-primary-fixed-dim rounded-xl shadow-[0_0_50px_rgba(0,219,231,0.15)] flex flex-col overflow-hidden relative transform transition-all">
<!-- Atmospheric inner glow -->
<div class="absolute inset-0 pointer-events-none shadow-[inset_0_0_60px_rgba(0,219,231,0.05)] z-0"></div>
<!-- Scanline effect -->
<div class="absolute inset-0 pointer-events-none scanline-overlay opacity-[0.15] z-0"></div>
<!-- Header -->
<div class="px-margin-mobile md:px-margin-desktop py-margin-mobile border-b border-white/10 relative z-10 flex justify-between items-center bg-surface-container-high/40">
<div>
<h1 class="font-headline-md text-headline-md text-primary drop-shadow-[0_0_8px_rgba(0,219,231,0.6)] tracking-wide">GAME SETTINGS</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-1 opacity-80">SYS.CONFIG // GATE_DASH_OS</p>
</div>
<button aria-label="Close settings" class="text-on-surface-variant hover:text-primary transition-colors hover:drop-shadow-[0_0_8px_rgba(0,219,231,0.5)] focus:outline-none focus:ring-2 focus:ring-primary/50 rounded-full p-1">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Content Body -->
<div class="p-margin-mobile md:p-margin-desktop flex flex-col gap-margin-desktop relative z-10">
<!-- Difficulty Toggles -->
<div class="flex flex-col gap-hud-gap">
<label class="font-label-caps text-label-caps text-secondary tracking-widest drop-shadow-[0_0_4px_rgba(235,178,255,0.4)] flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]">warning</span>
                        DIFFICULTY PROTOCOL
                    </label>
<div class="grid grid-cols-3 gap-unit p-1 bg-surface-container-highest/40 rounded-lg border border-white/5">
<button class="bg-transparent text-on-surface-variant font-data-sm text-data-sm py-2 rounded hover:bg-white/5 hover:text-white transition-all text-center focus:outline-none">RELAXED</button>
<button class="bg-secondary-container/20 text-secondary-fixed border border-secondary-fixed font-data-sm text-data-sm py-2 rounded shadow-[0_0_15px_rgba(182,0,248,0.3)] transition-all text-center relative overflow-hidden focus:outline-none">
<span class="relative z-10">ARCADE</span>
<div class="absolute inset-0 bg-secondary opacity-10 animate-pulse z-0"></div>
</button>
<button class="bg-transparent text-on-surface-variant font-data-sm text-data-sm py-2 rounded hover:bg-white/5 hover:text-white transition-all text-center focus:outline-none">HARDCORE</button>
</div>
</div>
<!-- Game Speed Toggles -->
<div class="flex flex-col gap-hud-gap">
<label class="font-label-caps text-label-caps text-primary tracking-widest drop-shadow-[0_0_4px_rgba(0,219,231,0.4)] flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]">speed</span>
                        SIMULATION SPEED
                    </label>
<div class="grid grid-cols-2 gap-unit p-1 bg-surface-container-highest/40 rounded-lg border border-white/5">
<button class="bg-primary-container/20 text-primary border border-primary-fixed-dim font-data-sm text-data-sm py-2 rounded shadow-[0_0_15px_rgba(0,219,231,0.3)] transition-all text-center focus:outline-none">NORMAL</button>
<button class="bg-transparent text-on-surface-variant font-data-sm text-data-sm py-2 rounded hover:bg-white/5 hover:text-white transition-all text-center focus:outline-none flex justify-center items-center gap-1">
                            OVERDRIVE
                            <span class="material-symbols-outlined text-[12px] text-tertiary-fixed-dim opacity-50">bolt</span>
</button>
</div>
</div>
<!-- Input Help Diagram -->
<div class="flex flex-col gap-hud-gap">
<label class="font-label-caps text-label-caps text-on-surface-variant tracking-widest flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]">keyboard</span>
                        INPUT TELEMETRY
                    </label>
<div class="bg-surface-container-highest/30 rounded-lg p-gutter border border-white/5 flex flex-col sm:flex-row gap-gutter items-center shadow-[inset_0_0_20px_rgba(0,0,0,0.5)]">
<!-- Movement Grid -->
<div class="flex-1 flex flex-col items-center gap-2 w-full">
<div class="font-label-caps text-label-caps text-on-surface-variant/70 mb-1">NAVIGATION</div>
<div class="grid grid-cols-3 grid-rows-2 gap-1 w-[96px]">
<div class="col-start-2 w-full aspect-square border border-white/10 border-b-white/20 rounded bg-surface-container flex items-center justify-center text-on-surface font-data-sm text-data-sm shadow-[0_2px_4px_rgba(0,0,0,0.5)]">W</div>
<div class="col-start-1 row-start-2 w-full aspect-square border border-white/10 border-b-white/20 rounded bg-surface-container flex items-center justify-center text-on-surface font-data-sm text-data-sm shadow-[0_2px_4px_rgba(0,0,0,0.5)]">A</div>
<div class="col-start-2 row-start-2 w-full aspect-square border border-white/10 border-b-white/20 rounded bg-surface-container flex items-center justify-center text-on-surface font-data-sm text-data-sm shadow-[0_2px_4px_rgba(0,0,0,0.5)]">S</div>
<div class="col-start-3 row-start-2 w-full aspect-square border border-white/10 border-b-white/20 rounded bg-surface-container flex items-center justify-center text-on-surface font-data-sm text-data-sm shadow-[0_2px_4px_rgba(0,0,0,0.5)]">D</div>
</div>
</div>
<!-- Divider -->
<div class="hidden sm:block w-[1px] h-16 bg-white/10"></div>
<div class="block sm:hidden w-full h-[1px] bg-white/10"></div>
<!-- Action Bar -->
<div class="flex-1 flex flex-col items-center gap-2 w-full">
<div class="font-label-caps text-label-caps text-primary/70 mb-1">DASH / FIRE</div>
<div class="w-full max-w-[140px] h-[36px] mt-0 sm:mt-[18px] border border-primary/20 border-b-primary/40 rounded bg-primary-container/10 flex items-center justify-center text-primary font-data-sm text-data-sm shadow-[0_2px_8px_rgba(0,219,231,0.15)] relative overflow-hidden">
<span class="relative z-10 tracking-widest">SPACE</span>
<div class="absolute inset-x-0 bottom-0 h-[2px] bg-primary blur-[2px]"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-margin-mobile md:px-margin-desktop py-gutter border-t border-white/10 flex flex-col gap-gutter bg-surface-container-lowest/40 relative z-10">
<button class="w-full py-4 bg-primary-fixed-dim text-on-primary-fixed font-data-lg text-data-lg rounded-md shadow-[0_0_20px_rgba(0,219,231,0.4)] hover:scale-[1.02] hover:shadow-[0_0_30px_rgba(0,219,231,0.6)] hover:brightness-125 transition-all duration-200 flex items-center justify-center gap-3 focus:outline-none focus:ring-2 focus:ring-white">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
                    SAVE PREFERENCES
                </button>
<div class="flex flex-col-reverse sm:flex-row justify-between items-center gap-4 sm:gap-0 mt-2">
<button class="font-label-caps text-label-caps text-on-surface-variant hover:text-white transition-colors underline decoration-white/20 underline-offset-4 focus:outline-none">
                        RESET TO DEFAULTS
                    </button>
<button class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1 focus:outline-none group">
                        RETURN TO GAME
                        <span class="material-symbols-outlined text-[16px] group-hover:translate-x-1 transition-transform">logout</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
