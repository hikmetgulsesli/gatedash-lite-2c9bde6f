<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gameplay - GateDash Lite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700;800&amp;family=Inter:wght@400;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "on-error": "#690005",
                            "surface-container-high": "#2a292f",
                            "secondary-container": "#b600f8",
                            "surface-container": "#1f1f25",
                            "tertiary-container": "#ffd49c",
                            "on-tertiary-fixed-variant": "#624000",
                            "surface-container-lowest": "#0e0e13",
                            "surface-dim": "#131318",
                            "tertiary": "#fff6ef",
                            "on-surface-variant": "#b9cacb",
                            "inverse-surface": "#e4e1e9",
                            "on-background": "#e4e1e9",
                            "secondary": "#ebb2ff",
                            "on-error-container": "#ffdad6",
                            "on-tertiary-container": "#845600",
                            "on-surface": "#e4e1e9",
                            "surface-variant": "#35343a",
                            "on-secondary-container": "#fff6fc",
                            "secondary-fixed-dim": "#ebb2ff",
                            "on-tertiary": "#452b00",
                            "error": "#ffb4ab",
                            "surface-tint": "#00dbe7",
                            "outline-variant": "#3a494b",
                            "on-primary-fixed": "#002022",
                            "tertiary-fixed": "#ffddb3",
                            "on-secondary": "#520072",
                            "on-primary-container": "#006a71",
                            "primary-container": "#00f2ff",
                            "surface-container-low": "#1b1b20",
                            "primary-fixed": "#74f5ff",
                            "secondary-fixed": "#f8d8ff",
                            "background": "#131318",
                            "on-tertiary-fixed": "#291800",
                            "inverse-on-surface": "#303036",
                            "on-secondary-fixed-variant": "#74009f",
                            "primary-fixed-dim": "#00dbe7",
                            "primary": "#e1fdff",
                            "on-secondary-fixed": "#320047",
                            "inverse-primary": "#00696f",
                            "surface-bright": "#39383e",
                            "on-primary": "#00363a",
                            "surface-container-highest": "#35343a",
                            "surface": "#131318",
                            "tertiary-fixed-dim": "#ffb950",
                            "error-container": "#93000a",
                            "outline": "#849495",
                            "on-primary-fixed-variant": "#004f54"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                    },
                    "spacing": {
                            "margin-mobile": "16px",
                            "gutter": "16px",
                            "unit": "4px",
                            "margin-desktop": "32px",
                            "hud-gap": "8px"
                    },
                    "fontFamily": {
                            "display-lg": ["Geist"],
                            "label-caps": ["Inter"],
                            "body-rt": ["Inter"],
                            "display-lg-mobile": ["Geist"],
                            "data-lg": ["JetBrains Mono"],
                            "data-sm": ["JetBrains Mono"],
                            "headline-md": ["Geist"]
                    },
                    "fontSize": {
                            "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                            "label-caps": ["11px", { "lineHeight": "12px", "letterSpacing": "0.15em", "fontWeight": "700" }],
                            "body-rt": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                            "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                            "data-lg": ["20px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                            "data-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500" }],
                            "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            overflow: hidden; /* Prevent scrolling during gameplay */
        }
        
        .playfield-bg {
            background: radial-gradient(circle at 50% 50%, theme('colors.surface-container-low') 0%, theme('colors.surface-container-lowest') 100%);
            background-image: 
                linear-gradient(theme('colors.white')/5 1px, transparent 1px),
                linear-gradient(90deg, theme('colors.white')/5 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: center center;
            animation: moveGrid 2s linear infinite;
        }

        @keyframes moveGrid {
            0% { transform: translateY(-60px) perspective(1000px) rotateX(60deg) scale(2); }
            100% { transform: translateY(0) perspective(1000px) rotateX(60deg) scale(2); }
        }

        .motion-blur {
            filter: blur(2px);
        }

        .bloom-cyan {
            box-shadow: 0 0 12px theme('colors.primary-fixed-dim'), inset 0 0 8px theme('colors.primary-fixed-dim');
        }
        
        .bloom-amber {
            box-shadow: 0 0 12px theme('colors.tertiary-fixed-dim'), inset 0 0 8px theme('colors.tertiary-fixed-dim');
        }

        .hud-glass {
            backdrop-filter: blur(24px);
            border: 1px solid theme('colors.white')/10;
        }

        /* Abstract game elements */
        .gate {
            border: 2px solid theme('colors.outline-variant');
            box-shadow: inset 0 0 20px theme('colors.primary-fixed-dim')/20;
        }
    </style>
</head>
<body class="relative w-screen h-screen">
<!-- Playfield Background -->
<div class="absolute inset-0 overflow-hidden perspective-[1000px] flex justify-center items-end opacity-50 z-0">
<div class="w-[200vw] h-[2048px] playfield-bg absolute bottom-0 origin-bottom"></div>
<!-- High Speed Motion Blur Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-transparent via-surface-container-lowest/80 to-surface-container-lowest z-0 pointer-events-none motion-blur"></div>
</div>
<!-- Active Gameplay Layer (Center Stage) -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none">
<!-- Approaching Gate -->
<div class="w-[300px] h-[150px] border-4 border-primary-fixed/50 gate rounded-lg absolute bottom-[40%] transform scale-150 opacity-80 blur-[1px]"></div>
<!-- Near Gate -->
<div class="w-[500px] h-[250px] border-4 border-primary-fixed/80 gate rounded-xl absolute bottom-[20%] transform scale-110 opacity-100 shadow-[0_0_30px_theme('colors.primary-fixed-dim')/30]"></div>
<!-- Danger/Hazard -->
<div class="w-16 h-16 bg-tertiary-fixed-dim/20 border-2 border-tertiary-fixed-dim rounded-full absolute bottom-[30%] left-[30%] bloom-amber blur-[1px]"></div>
<!-- The Player 'Chip' -->
<div class="w-12 h-12 bg-primary-fixed-dim rounded-lg absolute bottom-[15%] shadow-[0_0_20px_theme('colors.primary-fixed-dim')] transform rotate-45 z-20 bloom-cyan">
<!-- Spark trailing effect placeholder -->
<div class="absolute -bottom-4 -left-4 w-4 h-4 bg-primary-fixed rounded-full blur-sm opacity-60"></div>
<div class="absolute -bottom-8 -left-2 w-3 h-3 bg-primary rounded-full blur-sm opacity-40"></div>
</div>
</div>
<!-- START GAME Overlay (Active in this example to show the requested state) -->
<div class="absolute inset-0 z-30 flex items-center justify-center bg-surface-container-lowest/60 backdrop-blur-sm" id="start-overlay">
<button class="px-8 py-4 bg-primary-fixed-dim text-surface-container-lowest font-data-lg text-data-lg rounded hover:scale-105 hover:shadow-[0_0_25px_theme('colors.primary-fixed-dim')] transition-all duration-200 cursor-pointer pointer-events-auto" onclick="document.getElementById('start-overlay').style.display='none'">
            START GAME
        </button>
</div>
<!-- TopAppBar (From JSON, adapted for HUD context) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop py-hud-gap bg-surface-container/60 dark:bg-surface-container-low/40 backdrop-blur-xl border-b border-white/10 shadow-[0_0_12px_rgba(0,219,231,0.2)]">
<!-- Brand / Logo -->
<div class="font-display-lg-mobile text-display-lg-mobile font-extrabold text-primary-container dark:text-primary-fixed drop-shadow-[0_0_8px_rgba(0,219,231,0.5)] uppercase tracking-tighter">
            GATEDASH LITE
        </div>
<!-- Central HUD Stats (Score/Level/Energy) -->
<div class="hidden md:flex items-center gap-margin-desktop">
<div class="flex flex-col items-center hud-glass px-4 py-2 rounded-lg bg-surface-container-lowest/40">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Score</span>
<span class="font-data-lg text-data-lg text-primary-fixed-dim">1,240</span>
</div>
<div class="flex flex-col items-center hud-glass px-4 py-2 rounded-lg bg-surface-container-lowest/40">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Level</span>
<span class="font-data-lg text-data-lg text-secondary-fixed-dim">04</span>
</div>
<div class="flex flex-col items-start hud-glass px-4 py-2 rounded-lg bg-surface-container-lowest/40 w-48">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Energy</span>
<div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden border border-outline-variant">
<div class="h-full bg-gradient-to-r from-secondary-container to-primary-container w-[75%] shadow-[0_0_8px_theme('colors.primary-fixed-dim')]"></div>
</div>
</div>
</div>
<!-- Trailing Actions -->
<div class="flex gap-gutter items-center">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 text-on-surface-variant hover:text-primary-fixed transition-colors pointer-events-auto" title="Restart">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">refresh</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 text-on-surface-variant hover:text-primary-fixed transition-colors pointer-events-auto" title="Pause">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 text-on-surface-variant hover:text-primary-fixed transition-colors pointer-events-auto" title="Settings">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</div>
</header>
<!-- Mobile HUD Fallback (if screen is too small for top bar stats) -->
<div class="md:hidden fixed top-[80px] left-margin-mobile right-margin-mobile z-40 flex justify-between">
<div class="flex flex-col hud-glass px-3 py-1 rounded bg-surface-container-lowest/60">
<span class="font-label-caps text-label-caps text-on-surface-variant">SCORE</span>
<span class="font-data-sm text-data-sm text-primary-fixed-dim">1,240</span>
</div>
<div class="flex flex-col hud-glass px-3 py-1 rounded bg-surface-container-lowest/60">
<span class="font-label-caps text-label-caps text-on-surface-variant">LVL</span>
<span class="font-data-sm text-data-sm text-secondary-fixed-dim">04</span>
</div>
</div>
<!-- Footer / Legend -->
<footer class="fixed bottom-0 left-0 w-full flex justify-between px-margin-mobile md:px-margin-desktop py-2 pointer-events-none z-50 bg-transparent">
<div class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase opacity-70">
            SPACE to Dash • ESC to Pause • M for Settings
        </div>
<div class="font-label-caps text-label-caps text-on-surface-variant opacity-50 uppercase">
            © 2024 NEON ARCADE SYSTEMS
        </div>
</footer>
</body></html>
